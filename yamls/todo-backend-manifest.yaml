apiVersion: v1
kind: Secret
metadata:
  name: todo-backend-env
type: Opaque
stringData:
  DB_HOST: "<RDS_MYSQL_ENDPOINT>"
  DB_NAME: "todo-db"
  DB_USER: "admin"
  DB_PASSWORD: "<CHANGE_ME_DB_PASSWORD>"
  DB_RETRY_DELAY_MS: "500"
  DB_AWS: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: default
  name: todo-backend-uploads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  labels:
    app: todo-backend
  name: todo-backend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: marceleno17/todo-backend:latest
          envFrom:
            - secretRef:
                name: todo-backend-env
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: todo-backend-uploads
---
apiVersion: v1
kind: Service
metadata:
  namespace: default
  labels:
    app: todo-backend
  name: todo-backend

spec:
  type: NodePort
  selector:
    app: todo-backend
  ports:
    - port: 3000
      targetPort: 3000
